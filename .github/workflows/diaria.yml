name: ViraClipe Diaria (split publico/full)

# PÚBLICO-SAFE: só main + schedule leem Secrets. PR de fork NUNCA recebe secret.
on:
  schedule:
    - cron: "30 0 * * *" # 21:30 BRT (30min após o último slot, engatilha o dia seguinte)
  workflow_dispatch:
    inputs:
      date:
        description: "Data AAAA-MM-DD (vazio = hoje)"
        required: false
        default: ""
      max_vods:
        description: "Max VODs no dia"
        required: false
        default: "2"
      publish:
        description: "Postar no Buffer de verdade?"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: viraclipe-diaria
  cancel-in-progress: false

jobs:
  diaria:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_MODEL: gemini-3.6-flash
      SCORE_MODEL: gemini-3.5-flash-lite
      SCORE_THRESHOLD: "75"
      DAILY_CAP: "5"
      MAX_VODS_DIA: ${{ inputs.max_vods || '3' }}
      SCORE_W_CHAT: ${{ vars.SCORE_W_CHAT }}
      SCORE_W_AUDIO: ${{ vars.SCORE_W_AUDIO }}
      SCORE_W_LLM: ${{ vars.SCORE_W_LLM }}
      SIGNAL_W_CHAT: ${{ vars.SIGNAL_W_CHAT }}
      SIGNAL_W_AUDIO: ${{ vars.SIGNAL_W_AUDIO }}
      VIRACLIP_PROMPT_B64: ${{ secrets.VIRACLIP_PROMPT_B64 }}
      VIRACLIP_BLOCKLIST_B64: ${{ secrets.VIRACLIP_BLOCKLIST_B64 }}
      VIRACLIP_PACK_JSON_B64: ${{ secrets.VIRACLIP_PACK_JSON_B64 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      BUFFER_API_KEY: ${{ inputs.publish && secrets.BUFFER_API_KEY || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Deps sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Deps python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke split (publico roda capado, full com tempero)
        run: |
          python -c "from config.secret_loader import mode_label; print('MODE:', mode_label())"
          pytest tests/test_split.py -q
      - name: Restaura banco (anti-repetição entre dias)
        uses: actions/cache/restore@v4
        with:
          path: data/viraclipe.db
          key: viraclipe-db-${{ github.run_id }}
          restore-keys: viraclipe-db-
      - name: Seed + ativa whitelist
        env:
          VIRACLIP_ACTIVE: ${{ vars.VIRACLIP_ACTIVE }}
        run: |
          python3 -m tools.seed_whitelist --seed
          # shellcheck disable=SC2086
          python3 -m tools.seed_whitelist --sync $VIRACLIP_ACTIVE || true
          python3 -m tools.seed_whitelist --list
      - name: Run diaria
        run: |
          DAY="${{ inputs.date }}"
          if [ -z "$DAY" ]; then DAY=$(date +%F); fi
          python3 -m factory.run_diaria --date "$DAY" >> "data/logs/cron-$DAY.log" 2>&1 || echo "exit=$?"
      - name: Upload logs/pack (1 dia)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viraclipe-day
          path: |
            data/logs/cron-*.log
            data/factory/*/pack.json
            data/factory/*/buffer.json
            data/factory/*/scored.json
            data/factory/*/scored_full.json
            data/factory/*/transcritos.json
            data/factory/*/candidatos.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Salva banco (dedup/denylist do próximo dia)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/viraclipe.db
          key: viraclipe-db-${{ github.run_id }}
      - name: Avisa dono no Telegram (sempre)
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'EOF'
          import glob, os, urllib.request, urllib.parse
          tok, chat, st = (os.environ.get("TG_TOKEN", ""), os.environ.get("TG_CHAT", ""),
                           os.environ.get("JOB_STATUS", "?"))
          if not (tok and chat):
              print("sem Telegram configurado — aviso pulado")
              raise SystemExit(0)
          logs = sorted(glob.glob("data/logs/cron-*.log"))
          day = logs[-1].split("cron-")[-1].replace(".log", "") if logs else "?"
          res = []
          if logs:
              txt = open(logs[-1], encoding="utf-8", errors="replace").read()
              for line in txt.splitlines():
                  if any(k in line for k in ("Discovery:", "Disco livre", "Candidatos:",
                                             "Transcritos:", "Selecionados", "QC OK",
                                             "QC FALHA", "FALHA", "FIM ", "Nenhuma VOD",
                                             "falhou", "Pack logado", "Buffer OK", "SEM ")):
                      res.append(line.strip()[:160])
          icon = "✅" if st == "success" else "🚨"
          msg = f"{icon} ViraClipe {day} — {st}\n" + ("\n".join(res[-12:]) if res else "(sem resumo no log)")
          data = urllib.parse.urlencode({"chat_id": chat, "text": msg[:3500]}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{tok}/sendMessage",
                                 data=data, timeout=30)
          print("aviso enviado:", st)
          EOF
