name: ViraClipe Bot Poll (sem daemon)

# Bot sem servidor: a cada 15 min busca updates do Telegram, processa
# ✅/❌/títulos/comandos e morre. Offset no banco (nunca repete update).
# Mesma proteção do resto: PR de fork nunca recebe secret.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viraclipe-bot-poll
  cancel-in-progress: false

jobs:
  poll:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Deps python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restaura banco (offset + fila)
        uses: actions/cache/restore@v4
        with:
          path: data/viraclipe.db
          key: viraclipe-db-${{ github.run_id }}
          restore-keys: viraclipe-db-
      - name: Aplica seed anti-repetição
        run: |
          if [ -f data/seed_state.sql ]; then
            python3 -c "import sqlite3; con=sqlite3.connect('data/viraclipe.db'); con.executescript(open('data/seed_state.sql',encoding='utf-8').read()); con.commit(); con.close(); print('seed aplicado')"
          fi
      - name: Poll Telegram
        run: python3 tools/bot_poll.py
      - name: Salva banco
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/viraclipe.db
          key: viraclipe-db-${{ github.run_id }}
